# Load this file from Apache only after ModSecurity v2 and OWASP CRS are installed.
# Start in DetectionOnly mode, review false positives, then change to On.
SecRuleEngine DetectionOnly
SecRequestBodyAccess On
SecResponseBodyAccess Off
SecAuditEngine RelevantOnly
SecAuditLogType Serial
SecAuditLog "D:/farming_management_system/storage/logs/modsecurity-audit.log"
SecAuditLogParts ABIJDEFHZ
SecDebugLogLevel 0

# OWASP CRS 4.29.0 installed from its checksum-verified official release.
Include "D:/SecurityTools/OWASP-CRS/coreruleset-4.29.0/crs-setup.conf.example"
Include "D:/SecurityTools/OWASP-CRS/coreruleset-4.29.0/rules/*.conf"

# Keep the application-specific rule IDs in a separate range.
SecRule REQUEST_URI "@beginsWith /farming_management_system/uploads/" \
    "id:1000001,phase:1,deny,status:403,log,msg:'Executable request blocked in upload storage',chain"
    SecRule REQUEST_URI "@rx \.(?:php[0-9]?|phtml|phar|cgi|pl|py|sh|exe|bat|cmd)$" "t:lowercase"
